name: Foundation checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python -m reasoning validate
      - name: Verify unimplemented product Golden gate stays closed
        shell: bash
        run: |
          if python -m reasoning release-check; then
            echo "Unresolved catalog must not pass product release gate"
            exit 1
          fi
